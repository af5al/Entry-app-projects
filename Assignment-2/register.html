<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FashionHub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="register-page">

    <!-- Register Section -->
    <div class="main-container">

        <div class="register-box">

            <h1><a href="index.html" style="color:inherit;text-decoration:none;">FashionHub</a></h1>
            <p class="subtitle">Create your account.</p>

            <!-- Registration Form -->
            <form>

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="jane@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="register-btn">
                    Register &#9656;
                </button>

            </form>

            <p class="login-text">
                Already have an account? <a href="login.html">Log In</a>
            </p>

        </div>

    </div>

</body>
</html>
