<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | FashionHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/register-page/styles.css" />
    <link rel="stylesheet" href="css/Styles.css" />
  </head>
  <body>
    <!-- Top Navigation Header -->

    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title" class="brand-logo">FashionHub</h1>
        <p class="auth-subtitle">Welcome back. Please enter your details.</p>

        <form class="auth-form">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10"
                />
                <path d="M3 7l9 6l9 -6" />
              </svg>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
              />
            </div>
          </div>

          <div class="field">
            <div class="field-header">
              <label for="password">Password</label>
              <a class="forgot-link" href="#">Forgot Password?</a>
            </div>
            <div class="input-wrap">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"
                />
                <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
                <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                value="password123"
                autocomplete="current-password"
              />
              <button
                class="visibility-toggle"
                type="button"
                aria-label="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" />
                  <path
                    d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"
                  />
                  <path d="M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <label class="remember-row">
            <input type="checkbox" name="remember" />
            <span>Remember Me</span>
          </label>

          <button class="register-button" type="submit">Login</button>

          <div class="auth-divider">Or continue with</div>

          <div class="social-buttons">
            <button class="social-button" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
                <path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                <path
                  d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"
                />
              </svg>
              Google
            </button>
            <button class="social-button" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
                <path d="M3.6 9h16.8" />
                <path d="M3.6 15h16.8" />
                <path d="M11.5 3a17 17 0 0 0 0 18" />
                <path d="M12.5 3a17 17 0 0 1 0 18" />
              </svg>
              Facebook
            </button>
          </div>
        </form>

        <p class="auth-footer">
          Don't have an account? <a href="#">Register</a>
        </p>
      </section>
    </main>
  </body>
</html>
