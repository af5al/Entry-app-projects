
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionHub - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper d-flex justify-content-center align-items-center">
        <div class="register-card register-card mt-5 mb-5">
            <div class="text-center mb-3">
                <h1>FashionHub</h1>
                <p>Create your account.</p>
            </div>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name"
                        placeholder="Jane Doe" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email"
                        placeholder="jane@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone"
                        placeholder="+1 (555) 000-0000" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password"
                        placeholder="........." required>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>
                    <input type="password" class="form-control" id="confirmPassword"
                        placeholder="........." required>
                </div>

                <button type="submit" class="btn btn-dark register-btn w-100">
                    Register <i class="bi bi-caret-right-fill"></i>
                </button>

            </form>

            <p class="login-text text-center mt-3">
                Already have an account?
                <a href="#">Log In</a>
            </p>

        </div>

    </div>

</body>
</html>
