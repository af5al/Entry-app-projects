<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | YNot</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header"><a class="logo" href="index.html">YNot</a>
        <nav><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About Us</a><a
                href="contact.html">Contact Us</a></nav>
        <div class="account-links"><a href="wishlist.html">Wishlist</a><a href="register.html">Register</a><a
                href="login.html">Login</a><a href="checkout.html">Bag (0)</a></div>
    </header>
    <main class="page-section">
        <p class="small-title">YOUR ORDER</p>
        <h1 class="page-heading">Checkout</h1>
        <div class="checkout-layout">
            <section>
                <h2>Your details</h2>
                <form class="simple-form"><label>Email address<input type="email"></label><label>Full name<input
                            type="text"></label><label>Address<input type="text"
                            placeholder="House number and street"></label>
                    <div class="two-fields"><label>City<input type="text"></label><label>PIN code<input
                                type="text"></label></div><label>State<input type="text"
                            placeholder="Your state"></label><label>Country<select>
                            <option selected>India</option>
                        </select></label><a class="button" href="success.html">Place order</a>
                    <p class="help-note">Sample checkout page · No payment is taken.</p>
                </form>
            </section>
            <aside class="order-box">
                <h2>Order summary</h2>
                <div class="order-line"><span>Classic Crew T-Shirt × 1</span><span>₹799</span></div>
                <div class="order-line"><span>Shipping</span><span>Free</span></div>
                <hr>
                <p class="total-row"><span>Total</span><strong>₹799</strong></p>
            </aside>
        </div>
    </main>
    <footer>
        <p>YNot · Men's casual wear for every day</p>
        <div><a href="products.html">Shop</a><a href="contact.html">Contact</a></div><small>© 2025 YNot</small>
    </footer>
</body>

</html>
