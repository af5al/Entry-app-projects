
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | FashionHub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/product_details.css">

</head>

<body>

    <!-- Header -->
    <header>
        <div class="container-fluid px-4">

            <div class="d-flex align-items-center justify-content-between">

                <a href="#" class="logo">FashionHub</a>

                <nav>
                    <a href="men.html">Men</a>
                    <a href="women.html">Women</a>
                    <a href="accessories.html">Accessories</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </nav>

                <div class="header-icons">
                    <i class="bi bi-search"></i>
                    <a href="./wishlist.html"><i class="bi bi-heart"></i></a>
                    <i class="bi bi-bag"></i>
                    <i class="bi bi-person"></i>
                </div>

            </div>
        </div>
    </header>


    <!-- Breadcrumb -->
    <div class="container product-container">

        <div class="breadcrumb">
            <a href="women.html">Women</a>
            <i class="bi bi-chevron-right"></i>
            <a href="#">Outerwear</a>
            <i class="bi bi-chevron-right"></i>
            <span>Structured Wool Coat</span>
        </div>

    </div>


    <!-- Product Details Section -->
    <section class="container product-container">

        <div class="row">

            <!-- Left: Product Images -->
            <div class="col-lg-7">

                <div class="product-gallery">

                    <!-- Thumbnail Images -->
                    <div class="thumbnail-images">

                        <img src="./assets/coat-1.png" alt="Coat Front">

                        <img src="./assets/coat-2.png" alt="Coat Detail">

                        <img src="./assets/coat-3.png" alt="Coat Back">

                    </div>

                    <!-- Main Image -->
                    <div class="main-image">

                        <img src="./assets/coat-main.png" alt="Structured Wool Coat">

                        <button type="button" class="zoom-button">
                            <i class="bi bi-search"></i>
                        </button>

                    </div>

                </div>

            </div>


            <!-- Right: Product Information -->
            <div class="col-lg-5">

                <div class="product-info">

                    <!-- Brand and Wishlist -->
                    <div class="brand">
                        <span>MAISON LUXE</span>
                        <i class="bi bi-heart"></i>
                    </div>


                    <!-- Product Name -->
                    <h1>Structured Wool Coat</h1>


                    <!-- Rating -->
                    <div class="product-rating">

                        <div class="stars">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                        </div>

                        <span>4.8 (124 Reviews)</span>

                        <span class="stock">
                            <i class="bi bi-check-circle"></i>
                            In Stock
                        </span>

                    </div>


                    <!-- Price -->
                    <div class="product-price">
                        $1,250.00
                    </div>


                    <!-- Colour Selection -->
                    <div class="color-selection">

                        <h6>COLOR: <span>CAMEL</span></h6>

                        <div class="color-options">

                            <button type="button"
                                class="color-circle active camel"
                                aria-label="Camel"></button>

                            <button type="button"
                                class="color-circle charcoal"
                                aria-label="Charcoal"></button>

                            <button type="button"
                                class="color-circle black"
                                aria-label="Black"></button>

                        </div>

                    </div>


                    <!-- Size Selection -->
                    <div class="size-selection">

                        <div class="size-heading">
                            <h6>SELECT SIZE</h6>
                            <a href="#">Size Guide</a>
                        </div>

                        <div class="size-options">

                            <button type="button">34</button>
                            <button type="button">36</button>
                            <button type="button" class="active">38</button>
                            <button type="button">40</button>
                            <button type="button">42</button>

                        </div>

                    </div>


                    <!-- Quantity Selection -->
                    <div class="quantity-selection">

                        <h6>QUANTITY</h6>

                        <div class="quantity-control">

                            <button type="button">−</button>

                            <input type="number" value="1" min="1">

                            <button type="button">+</button>

                        </div>

                    </div>


                    <!-- Purchase Buttons -->
                    <div class="purchase-buttons">

                        <button type="button" class="add-to-cart">
                            <i class="bi bi-bag"></i>
                            ADD TO CART
                        </button>

                        <button type="button" class="buy-now">
                            BUY NOW
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>


</body>
</html>
