
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/register.css">

</head>

<body>

    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="reg-container w-100 p-4 p-sm-5">

            <!-- Heading -->
            <div class="head-part">
                <h1>FashionHub</h1>
                <h6>Create your account.</h6>
            </div>

            <!-- Register Form -->
            <form action="">

                <div class="name">
                    <label for="name">Full Name</label>
                    <input type="text" name="name" id="name" placeholder="Jane Doe">
                </div>

                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="jane@example.com">
                </div>

                <div class="phone">
                    <label for="phone">Phone</label>
                    <input type="tel" name="phone" id="phone" placeholder="+1 (555) 000-0000">
                </div>

                <div class="password">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="••••••••">
                </div>

                <div class="c-password">
                    <label for="c-password">Confirm Password</label>
                    <input type="password" name="c-password" id="c-password" placeholder="••••••••">
                </div>

                <button type="submit">Register</button>

            </form>

            <!-- Footer -->
            <div class="footer">
                <p>Already have an account? <a href="#">Log In</a></p>
            </div>

        </div>

    </main>

</body>
</html>
